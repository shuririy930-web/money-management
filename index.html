<style>
/* =========================
   全体設定
========================= */

/* 幅ズレ防止（超重要） */
* {
  box-sizing: border-box;
}

/* 背景＆ベース文字サイズ */
body {
  font-family: 
    'EB Garamond',        /* 英語これ */
    'M PLUS Rounded 1c',  /* 日本語これ */
    sans-serif;

  padding: 20px;
  background: #e8f5e9; /* パステル黄緑 */
  font-size: 18px; /* 全体大きめ */
  
  color: #5d4037; /* 文字の色茶色 */
}


/* =========================
   見出し
========================= */
h2 {
  margin-top: 25px;
  font-size: 22px;
  text-align: center;
}

ul {
  padding: 0;
  margin: 0;
}

/* =========================
   入力カード
========================= */
.input-card {
  background: #ffffff;
  padding: 20px;
  border-radius: 15px;
  box-shadow: none;
  border: 2px solid #d7ccc8;
  margin-bottom: 10px;/* 入力エリアとの距離 */
}

/* 入力・セレクト・ボタン共通 */
.input-card input,
.input-card select,
.input-card button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 16px;
  font-size: 18px;
  border-radius: 10px;
  border: 1px solid #ddd;

  color: #5d4037; /* ← 入力文字も茶色に */
}

/* プレースホルダー */
.input-card input::placeholder {
  color: #a1887f; /* 少し薄い茶色 */
}

/* 入力フォーカス時（触ってる感） */
input:focus,
select:focus {
  outline: none;
  border: 2px solid #a5d6a7;
}

/* セレクトの見た目統一（iPhone対策） */
select {
  appearance: none;
}

/* 誰に払ったかのボックスと誰がを分割する */
.row {
  display: flex;
  gap: 10px;
}
.row select {
  flex: 1;
}

/* 日付～誰分までの並び方 */
.form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
}

.field {
    flex: 1;
}

.field label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

.field input,
.field select {
    width: 100%;
    box-sizing: border-box;
}

/* =========================
   メインボタン（追加）
========================= */
#mainBtn {
  background: #81c784;
  border: none;
  color: white;
  font-weight: bold;
  font-size: 20px;
  padding: 18px;
}


/* =========================
   精算結果
========================= */
.result-box {
  font-size: 32px;
  font-weight: bold;
  padding: 25px;
  margin: 20px 0;
  border-radius: 15px;
  text-align: center;
}
/* =========================
   精算結果レイアウト
========================= */

.result-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 22px;
  flex-wrap: nowrap;  /* ← 強制1行 */
}

/* アイコン＋名前セット */
.result-user {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 大きめアイコン */
.icon-result {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

/* 名前タグ */
.result-name {
  font-size: 12px;        /* 小さくする */
  margin-top: 3px;
  padding: 2px 6px;
  border-radius: 999px;
  background: #f1f8e9;
  white-space: nowrap;    /* ← 改行防止（超重要） */
}

/* 精算結果の金額（目立たせる＆改行防止） */
.result-amount {
  font-size: 26px;
  font-weight: bold;
  color: #e91e63;         /* 一覧と同じ赤 */
  white-space: nowrap;    /* ← 10万でも改行しない */
}

/* 矢印 */
.arrow {
  font-size: 26px;
  font-weight: bold;
}
/* =========================
   一覧（リスト）
========================= */

/* 各アイテムカード */
li {
  list-style: none;
  background: transparent;
  margin: 8px 0;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  font-size: 18px;
  
  overflow: hidden;
   /* スワイプ感　*/
  transition: transform 0.25s ease, opacity 0.25s ease;
  transform-origin: center;
  touch-action: pan-y;
  /* ゴミ箱アイコン　*/
  position: relative;
  overflow: hidden;
  display: block;
}

/* 上段（名前と金額） */
.item-top {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}

/* メモ */
.memo {
  font-size: 14px;
  color: #666;
  margin-top: 3px;
}

/* 誰の分を払ったかのアイコン */
.memo-icons {
  display: inline-flex;
  gap: 4px;
  margin-left: 6px;
  vertical-align: middle;
}
.memo-icons img {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  object-fit: cover;
}

/* ボタンエリア */
.buttons {
  margin-top: 10px;
}

/* 編集・削除ボタン */
.edit-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ゴミ箱（裏側） */
.swipe-bg {
  position: absolute;
  inset: 0;
  top: 0;
  right: 0;
  width: 100%;
  height: 100%;

  background: #ff5252;
  
  z-index: 1;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 20px;
  font-size: 22px;
  
  border-radius: 12px;
  
  transform-origin: center;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

/* 表側 */
.item-content {
  position: relative;
  z-index: 2;
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  width: 100%;
  box-sizing: border-box;
  transform-origin: center;
  transition: transform 0.25s ease, opacity 0.25s ease;
}
/* ボタン共通 */
button {
  font-size: 16px;
  padding: 10px 14px;
  border-radius: 8px;
}

/* アイコン関連 */
.user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.tag {
  background: #f1f8e9;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 14px;
}

.name {
  font-weight: bold;
  font-size: 18px;
}

.amount,
.result-amount {
  font-family: system-ui, sans-serif;
  font-weight: bold;
  color: #cd5c5c;
}

/* =========================
   モーダル全体（背景）
========================= */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);

  justify-content: center;
  align-items: center;
  
  z-index: 9999;
}

body.modal-open {
  overflow: hidden;
}

/* =========================
   モーダル中身
========================= */
.modal-content {
  background: #ffffe0; /* うっすいクリーム色 */
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
  border: 2px solid #d7ccc8;     /* 薄い茶色枠追加 */
  box-shadow: none;    
  text-align: center;
  
  position: relative;
  z-index: 10000;
}

/* タイトル */
.modal-content h3 {
  margin-bottom: 15px;
}

/* 入力（縦並び） */
.modal-content select,
.modal-content input {
  width: 100%;
  margin: 10px 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
  color: #5d4037; /* 茶色 */
}
/* プレースホルダー */
.modal-content input::placeholder {
  color: #a1887f;                /* ← 薄い茶色 */
}

/* フォーカス時も揃える */
.modal-content input:focus,
.modal-content select:focus {
  outline: none;
  border: 2px solid #a5d6a7;   
}

/* =========================
   ボタンエリア（横並び）
========================= */
.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

/* ボタン共通 */
.modal-buttons button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

/* キャンセル */
.cancel-btn {
  background: #e0e0e0;
  color: #5d4037;
}

/* 保存 */
.save-btn {
  background: #81c784;
  color: white;
}

/* ログ時刻表示 */
.debug-time {
  font-size: 12px;
  color: #d7ccc8;
  text-align: right;
  margin: 5px 5px 10px 0;
}

/* ログインの時のボタン */
#loginScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  display: flex;
  justify-content: center; /* 横中央 */
  align-items: center;     /* 縦中央 */

  background: #e8f5e9; /* 今の背景と同じ */
  z-index: 9999;
}

.login-btn {
  width: 50%;              
  max-width: 300px;        

  background:#d7ccc8;
  color:#5d4037;
  font-weight:bold;
  border:none;
  padding:18px 0;
  border-radius:12px;
  font-size:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);

  text-align: center;
}

/* ローディング */
#loading {
  position: fixed;
  inset: 0;
  background: #e8f5e9;

  display: flex;
  justify-content: center;
  align-items: center;

  z-index: 9999;
  
  opacity: 1;
  transition: opacity 0.4s ease;
}

.loading-box {
  text-align: center;
}

/* ローディングの時のロゴ */
.loading-logo {
  width: 120px;
  margin-bottom: 20px;
}

/* ローディング終了時のふわっと消える感じ */
#loading.hide {
  opacity: 0;
  pointer-events: none;
}

/* くるくる */
.spinner {
  width: 30px;
  height: 30px;
  border: 4px solid #d7ccc8;
  border-top: 4px solid #81c784;
  border-radius: 50%;
  margin: 0 auto 10px;

  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

   /* スマホ表示調整*/
@media (max-width: 600px) {

  .form-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .form-row .field {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
  }

  .form-row .field input,
  .form-row .field select {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
  }

  /* 日付入力の右側へのはみ出し防止 */
  .form-row .field input[type="date"] {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
    display: block;

    font-size: 16px;
    padding: 12px 8px;
  }

  /* 編集画面の日付も同じ幅にする */
  #editDate {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;

    font-size: 16px;
    padding: 12px 8px;
  }

     .chart-container {
    width: 100%;
    max-width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .chart-container canvas {
    display: block;
    margin: 0 auto;
  }
}

/* =========================
   下部固定ナビ
========================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;

    width: 100%;
    height: 65px;

    background: #ffffff;

    border-top: 1px solid #d7ccc8;

    display: flex;
    justify-content: space-around;
    align-items: center;

    z-index: 9998;
}


/* タブボタン */

.nav-btn {
    flex: 1;

    height: 100%;

    border: none;
    background: transparent;

    color: #8d6e63;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 3px;

    font-size: 14px;
}


/* 選択中 */

.nav-btn.active {
    color: #81c784;
    font-weight: bold;
}


/* 下部ナビに隠れないようにする */

body {
    padding-bottom: 85px;
}

/* 集計のCSS */   
   /* =========================
   月別集計
========================= */

.report-month-card {
  background: #ffffff;
  padding: 16px;

}

.report-month-card label {

.report-month-card input {

  color: #5d4037;
}


/* =========================
   合計支出
========================= */

.report-total-card {
  background: #ffffff;

  padding: 20px;

  border-radius: 15px;

  border: 2px solid #d7ccc8;

  text-align: center;

  margin-bottom: 15px;
}

.report-total-label {
  font-size: 16px;
  margin-bottom: 8px;
}

#reportTotal {
  font-family: system-ui, sans-serif;

  font-size: 32px;

  font-weight: bold;

  color: #cd5c5c;
}


/* =========================
   集計カード
========================= */

.report-card {
  background: #ffffff;

  padding: 18px;

  border-radius: 15px;

  border: 2px solid #d7ccc8;

  margin-bottom: 15px;
}

.report-card h3 {
  margin-top: 0;

  text-align: center;

  font-size: 20px;
}


/* =========================
   円グラフ
========================= */

.chart-container {
  width: 100%;
  max-width: 340px;
  margin: 0 auto;

  display: flex;
  justify-content: center;
  align-items: center;
}

.chart-container canvas {
  display: block;
  margin: 0 auto;
}


/* =========================
   カテゴリー一覧
========================= */

.category-row {
  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 12px 5px;

  border-bottom: 1px solid #eee;
}
.category-row:last-child {
  border-bottom: none;
}
.category-row strong {
  font-family: system-ui, sans-serif;

  color: #cd5c5c;
}

/* =========================
   Detailed list 月選択
========================= */

.list-month-selector {
  width: 180px;
  margin: 8px auto 15px;
}

.list-month-selector label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
  text-align: center;
}

.list-month-selector input {
  display: block;
  width: 100%;
  box-sizing: border-box;

  padding: 8px 10px;

  font-size: 15px;

  border: 1px solid #d7ccc8;
  border-radius: 8px;

  background: #ffffff;
  color: #5d4037;
}

.list-month-selector input:focus {
  outline: none;
  border: 2px solid #a5d6a7;
}

</style>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

import { 
  getAuth, 
  signInWithPopup,
  GoogleAuthProvider, 
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

// Firebase初期化
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const expensesRef = collection(db, "expenses");

// グローバル変数として公開
window.db = db;
window.expensesRef = expensesRef;

// 初期表示
document.getElementById("uidBox").innerText = "未ログイン";

// ログイン処理

// リアルタイム同期
function startListener() {

  if (unsubscribe) {
    unsubscribe();
  }

  unsubscribe = onSnapshot(expensesRef, (snapshot) => {

    updateTime("DB更新");

    dataList = snapshot.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));
    
    dataList.sort((a, b) => {
      const timeA = a.createdAt || 0;
      const timeB = b.createdAt || 0;
      return timeB - timeA;
    });

    render();
  });
}

  const li = document.createElement("li");

  li.innerHTML = `

        <div class="user">

  `;

  addSwipeDelete(li, d.id);
   });

  // 計算
 filteredData.forEach((d) => {
  const amount = Number(d.amount);
  const target = d.target || "AB";

  if (target === "AB") {
    if (d.payer === "A") {
      balance += amount / 2;
    } else {
      balance -= amount / 2;
    }
  } else if (target === "A") {
    if (d.payer === "B") {
      balance -= amount;
    }
  } else if (target === "B") {
    if (d.payer === "A") {
      balance += amount;
    }
  }
});

  const haruki = `
  <div class="result-user">
    <img src="${getIcon("A")}" class="icon-result">
    <div class="result-name">はるき</div>
  </div>
`;

const shuri = `

    <img src="${getIcon("B")}" class="icon-result">
    <div class="result-name">しゅり</div>
  </div>
`;

  let resultText = "";
  let color = "";

  if (balance === 0) {
  resultText = "精算なし！";
  color = "#ddffdd";

} else if (balance > 0) {
  resultText = `
    <div class="result-line">
      ${shuri}
      <div class="arrow">→</div>
      <div class="result-amount">${formatMoney(Math.round(balance))}円</div>
      <div class="arrow">→</div>
      ${haruki}
    </div>
  `;
  color = "#ffdddd";

} else {
  resultText = `
    <div class="result-line">
      ${haruki}
      <div class="arrow">→</div>
      <div class="result-amount">${formatMoney(Math.round(Math.abs(balance)))}円</div>
      <div class="arrow">→</div>
      ${shuri}
    </div>
  `;
  color = "#ddddff";
}

  // 計算結果表示エリア

window.addOrUpdate = async function () {
  try {
    const payer = document.getElementById("payer").value;

    const amount = Number(document.getElementById("amount").value);
    const memo = document.getElementById("memo").value;

                 category: document.getElementById("category").value
                 };

      // 新規追加の時だけ、タイムスタンプを追加

    document.getElementById("memo").value = "";

//スワイプ削除
function addSwipeDelete(li, id) {
  let startX = 0;
  let currentX = 0;
  let isSwiping = false;
  let moved = false;

  const content = li.querySelector(".item-content");
  const bg = li.querySelector(".swipe-bg");

  li.addEventListener("touchstart", (e) => {
    if (e.target.closest(".edit-btn")) return;

    startX = e.touches[0].clientX;
    isSwiping = false;
    moved = false;
  });

  li.addEventListener("touchmove", (e) => {
  if (e.target.closest(".edit-btn")) return;

  currentX = e.touches[0].clientX;
  const diff = currentX - startX;

  if (Math.abs(diff) > 15) {
    isSwiping = true;
    moved = true;
  }

  if (isSwiping && diff < 0) {
  content.style.transition = "none";
  content.style.transform = `translateX(${diff}px)`;
  }
});

li.addEventListener("touchend", async () => {
  const diff = currentX - startX;

  if (!moved) return;

content.style.transition = "0.25s";

if (diff < -80) {

  li.style.height = li.offsetHeight + "px";

  requestAnimationFrame(() => {
    li.style.transition = "height 0.4s ease, opacity 0.4s ease";
    
    li.style.height = "0px";
    li.style.opacity = "0";
    li.style.transform = "scaleY(0)";

    bg.style.opacity = "0";
  });

  setTimeout(async () => {
    await deleteItem(id);
  }, 600);

} else {
  content.style.transform = "translateX(0)";
  content.style.opacity = "1";
}
});
}

//ログ時刻表示用
function updateTime(label = "") {
  const now = new Date();
  const time =
    now.getHours().toString().padStart(2, "0") + ":" +
    now.getMinutes().toString().padStart(2, "0") + ":" +
    now.getSeconds().toString().padStart(2, "0");

  document.getElementById("debugTime").innerText =
    "最終更新: " + time + (label ? "（" + label + "）" : "");
}

// 金額表示
function formatReportMoney(num) {
  return "¥" + Number(num || 0).toLocaleString();
}


// =========================
// 集計本体
// =========================
window.updateReport = function () {

  const reportMonth = document.getElementById("reportMonth");

  if (!reportMonth) {
    console.log("reportMonth が見つかりません");
    return;
  }

  const selectedMonth = reportMonth.value;

  if (!selectedMonth) {
    return;
  }

  console.log("集計開始:", selectedMonth);
  console.log("現在のデータ件数:", dataList.length);

  // カテゴリー
  const categories = [
    "食費",
    "日用品",
    "お部屋作り",
    "外食",
    "家賃",
    "デート",
    "その他"
  ];

  // 初期化
  const categoryTotals = {};

  categories.forEach(category => {
    categoryTotals[category] = 0;
  });


  // =========================
  // 選択された年月だけ抽出
  // =========================
  const monthlyData = dataList.filter(d => {

    if (!d.date) return false;

    // d.date が「2026-08-10」なら
    // 「2026-08」と一致するか確認
    return String(d.date).startsWith(selectedMonth);

  });


  console.log("対象月のデータ:", monthlyData);


  // =========================
  // 合計支出
  // =========================
  let total = 0;

  monthlyData.forEach(d => {

    const amount = Number(d.amount) || 0;

    total += amount;

    const category = d.category || "その他";

    if (categoryTotals[category] === undefined) {
      categoryTotals[category] = 0;
    }

    categoryTotals[category] += amount;

  });


  // =========================
  // 合計金額を表示
  // =========================
  const reportTotal =
    document.getElementById("reportTotal");

  if (reportTotal) {
    reportTotal.textContent =
      formatReportMoney(total);
  }


  // =========================
  // カテゴリー一覧
  // =========================
  const categoryList =
    document.getElementById("categoryList");

  if (categoryList) {

    categoryList.innerHTML = "";

    categories.forEach(category => {

      const row = document.createElement("div");

      row.className = "category-row";

      row.innerHTML = `
        <span>${category}</span>
        <strong>
          ${formatReportMoney(categoryTotals[category])}
        </strong>
      `;

      categoryList.appendChild(row);

    });

  }


  // =========================
  // 円グラフ
  // =========================
  drawCategoryChart(categoryTotals);

};


// =========================
// 円グラフを描く
// Chart.jsを使わずCanvasで描画
// =========================
function drawCategoryChart(categoryTotals) {

  const canvas =
    document.getElementById("categoryChart");

  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  // Canvasサイズ
  const size = 340;

  canvas.width = size;
  canvas.height = size;

  ctx.clearRect(0, 0, size, size);


  const categories = [
    "食費",
    "日用品",
    "お部屋作り",
    "外食",
    "家賃",
    "デート",
    "その他"
  ];

  const values = categories.map(
    category => Number(categoryTotals[category]) || 0
  );

  const total =
    values.reduce((sum, value) => sum + value, 0);


  // データがない場合
  if (total === 0) {

    ctx.beginPath();

    ctx.arc(
      size / 2,
      size / 2,
      110,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#eeeeee";
    ctx.fill();

    ctx.fillStyle = "#8d6e63";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "支出なし",
      size / 2,
      size / 2
    );

    return;
  }


  // 円グラフ用の色
  const colors = [
    "#81c784",
    "#64b5f6",
    "#ba68c8",
    "#ffb74d",
    "#a1887f",
    "#4db6ac",
    "#f06292"
  ];


  let startAngle = -Math.PI / 2;

  const centerX = size / 2;
  const centerY = size / 2;
  const radius = 125;


values.forEach((value, index) => {

  if (value <= 0) return;

  const angle =
    (value / total) * Math.PI * 2;

  const endAngle =
    startAngle + angle;


  // =========================
  // 円グラフ本体
  // =========================

  ctx.beginPath();

  ctx.moveTo(centerX, centerY);

  ctx.arc(
    centerX,
    centerY,
    radius,
    startAngle,
    endAngle
  );

  ctx.closePath();

  ctx.fillStyle = colors[index];
  ctx.fill();


  // 境界線
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.stroke();


  // =========================
  // カテゴリー名＋金額
  // =========================

  const middleAngle =
    startAngle + angle / 2;

  const labelRadius = 88;

  const labelX =
    centerX + Math.cos(middleAngle) * labelRadius;

  const labelY =
    centerY + Math.sin(middleAngle) * labelRadius;


  // 小さい部分は文字を無理に入れない
  if (angle >= Math.PI / 6) {

    ctx.fillStyle = "#ffffff";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // カテゴリー名
    ctx.font = "bold 13px sans-serif";

    ctx.fillText(
      categories[index],
      labelX,
      labelY - 8
    );

    // 金額
    ctx.font = "bold 12px sans-serif";

    ctx.fillText(
      formatReportMoney(value),
      labelX,
      labelY + 9
    );
  }


  startAngle = endAngle;

});


  // =========================
  // 中央を白くしてドーナツ型
  // =========================
  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    55,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#ffffff";
  ctx.fill();


  // 中央に合計金額
  ctx.fillStyle = "#5d4037";
  ctx.font = "bold 17px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    formatReportMoney(total),
    centerX,
    centerY
  );

}

// ページ切り替え
// =========================
function showPage(page) {

  const warikaPage =
    document.getElementById("warikaPage");

  const reportPage =
    document.getElementById("reportPage");

  const navButtons =
    document.querySelectorAll(".nav-btn");


  // 割り勘
  if (page === "warika") {

    warikaPage.style.display = "block";
    reportPage.style.display = "none";

  }


  // 集計
  if (page === "report") {

    warikaPage.style.display = "none";
    reportPage.style.display = "block";

    // 集計更新
    updateReport();

  }


  // タブ色
  navButtons.forEach(btn => {
    btn.classList.remove("active");
  });


  if (page === "warika") {

    if (navButtons[0]) {
      navButtons[0].classList.add("active");
    }

  }


  if (page === "report") {

    if (navButtons[1]) {
      navButtons[1].classList.add("active");
    }

  }

}
